"$schema" = "./node_modules/wrangler/config-schema.json"
name = "print-manager"
compatibility_date = "2026-05-04"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "print-manager"
database_id = "ebe1b46e-e722-44ea-ab21-5e309be0c7c0"
preview_database_id = "DB"

# PR previews use an isolated config generated by scripts/preview.mjs.
# Native Git-integrated previews must never inherit the production DB above.
[env.preview]
d1_databases = []
vars = { APP_ENV = "preview", ALLOW_SAMPLE_RESET = "false" }
